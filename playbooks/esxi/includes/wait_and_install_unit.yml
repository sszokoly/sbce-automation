---
- name: "Initialize installability deployment state"
  ansible.builtin.set_fact:
    sbce_unit_installable: false
    sbce_unit_primary_installable: false
    sbce_unit_secondary_installable: false
    sbce_unit_last_error: ""
    sbce_unit_installable_deploy_attempts: "{{ sbce_installable_deploy_attempts | int }}"
  when: not current_group_failed | default(false) | bool

- name: "Wait, redeploy, and recheck SBCE unit installability"
  ansible.builtin.include_tasks:
    file: wait_and_install_unit_attempt.yml
  loop: "{{ range(1, (sbce_installable_deploy_attempts | int) + 1) | list }}"
  loop_control:
    loop_var: sbce_installable_deploy_attempt
    label: "deployment attempt {{ sbce_installable_deploy_attempt }}"
  when:
    - not current_group_failed | default(false) | bool
    - not sbce_unit_installable | bool

- name: "Install/commission installable SBCE unit"
  ansible.builtin.include_tasks:
    file: webui_install_unit.yml
  when:
    - not current_group_failed | default(false) | bool
    - sbce_unit_installable | bool
